<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فاحص YGH">
<meta name="theme-color" content="#0F5E63">
<title>فاحص YGH</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230F5E63'/><path d='M18 68h64' stroke='%23fff' stroke-width='6' stroke-linecap='round'/><path d='M22 58l14-16 12 9 16-21 14 12' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230F5E63'/><path d='M18 68h64' stroke='%23fff' stroke-width='6' stroke-linecap='round'/><path d='M22 58l14-16 12 9 16-21 14 12' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0EF; --surface:#FFFFFF; --sunk:#F3F6F6; --ink:#102A2C; --muted:#5A6E6F; --line:#D3DDDC;
  --accent:#0F5E63; --accent-ink:#FFFFFF;
  --ready:#1C8551; --near:#2862A6; --watch:#B07316; --none:#8A9A9B;
  --up:#1C8551; --down:#C2372B;
  --zone:rgba(28,133,81,.14); --ma20:#C98A1B; --ma50:#6C7FA8;
  --radius-lg:18px; --radius-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0A1A1C; --surface:#12282B; --sunk:#0E2124; --ink:#E2ECEB; --muted:#8FA6A7; --line:#21403F;
    --accent:#3FA9A5; --accent-ink:#06191A;
    --ready:#3DBA7E; --near:#5C9BE6; --watch:#E0A23C; --none:#6E8485;
    --up:#3DBA7E; --down:#EF6A5C;
    --zone:rgba(61,186,126,.16); --ma20:#E0A23C; --ma50:#8EA2CF;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.55; font-variant-numeric:tabular-nums;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:680px;margin:0 auto;padding:16px 14px 40px}

/* رأس الصفحة */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 14px}
.brand h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.2px}
.brand h1 b{color:var(--accent);font-weight:700}
.brand p{margin:0;color:var(--muted);font-size:13px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}

.scanbar{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--accent);color:var(--accent-ink);border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:12px}
.scanbar div{display:grid;grid-template-columns:auto auto;align-items:center;column-gap:7px;font-size:12.5px;white-space:nowrap}
.scanbar div span:not(.dot){opacity:.85}
.scanbar strong{grid-column:1/-1;font-size:17px;font-weight:600}
.scanbar div:last-child{text-align:left}
.scanbar div:last-child strong{grid-column:auto}
.dot{width:8px;height:8px;border-radius:50%;background:#7BE0A6;display:inline-block;align-self:center}
.dot.old{background:#F2B65A}

/* الفريمات */
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background:var(--sunk);border:1px solid var(--line);
  border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{border:0;background:transparent;padding:9px 6px;border-radius:10px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs small{font-weight:500;font-size:11px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);
  padding:1px 7px;border-radius:20px;margin-inline-start:6px}

/* العدادات */
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.counter{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-lg);padding:10px 12px;text-align:start}
.counter b{display:block;font-size:26px;line-height:1.2;font-weight:700}
.counter span{font-size:12.5px;color:var(--muted);line-height:1.35;display:block}
.counter[data-k="ready"] b{color:var(--ready)}
.counter[data-k="near"] b{color:var(--near)}
.counter[data-k="watch"] b{color:var(--watch)}
.counter[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.counter[data-k="ready"][aria-pressed="true"]{color:var(--ready)}
.counter[data-k="near"][aria-pressed="true"]{color:var(--near)}
.counter[data-k="watch"][aria-pressed="true"]{color:var(--watch)}
.counter[aria-pressed="true"] span{color:inherit}

/* البحث والترتيب */
.tools{display:flex;gap:8px;margin-bottom:8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;outline:0;width:100%;padding:11px 0}
select{flex:0 0 auto;width:36%;max-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.resultline{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;margin:2px 4px 8px;font-size:14px}
.resultline b{font-size:16px}
.pricenote{margin:-4px 4px 10px;font-size:12px;color:var(--muted)}
.resultline span{color:var(--muted);font-size:12px}

/* قائمة الأسهم */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.row{display:block;width:100%;border:0;background:transparent;text-align:start;padding:14px 16px}
.row:active{background:var(--sunk)}
.r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sym{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sym b{font-size:18px;font-weight:700;direction:ltr}
.flag{font-size:17px;line-height:1}
.cc{font-size:11px;padding:1px 7px;border-radius:20px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.tag{font-size:11px;padding:1px 8px;border-radius:20px;background:color-mix(in srgb,var(--watch) 16%,transparent);color:var(--watch);font-weight:600}
.star{color:#D9A21B;font-size:16px}
.name{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw;margin-top:1px}
.px{text-align:left;flex:none}
.px b{font-size:18px;font-weight:600;direction:ltr;display:block}
.chg{font-size:13px;font-weight:600;direction:ltr;display:block}
.up{color:var(--up)} .down{color:var(--down)}
.ext{display:block;font-size:11.5px;font-weight:600;margin-top:3px;padding:1px 7px;border-radius:20px;
  background:var(--sunk);white-space:nowrap}
.ext.warn{background:color-mix(in srgb,var(--down) 12%,transparent);color:var(--down)}
.r2{display:flex;align-items:center;gap:8px;margin:10px 0 8px}
.pill{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.ready{background:color-mix(in srgb,var(--ready) 15%,transparent);color:var(--ready)}
.pill.near{background:color-mix(in srgb,var(--near) 15%,transparent);color:var(--near)}
.pill.watch{background:color-mix(in srgb,var(--watch) 16%,transparent);color:var(--watch)}
.pill.none{background:var(--sunk);color:var(--none)}
.score{font-size:13px;color:var(--muted);white-space:nowrap}
.rr{flex:none;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;direction:ltr;background:var(--sunk)}
.rr.good{color:var(--ready)} .rr.mid{color:var(--watch)} .rr.bad{color:var(--down)}
.top-actions{display:flex;gap:8px}
.bt-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bt-cards .kv b{font-size:20px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:62px 1fr 64px;align-items:center;gap:10px;font-size:13px}
.bar .track{position:relative;height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .track i{position:absolute;top:0;bottom:0;border-radius:4px}
.bar .track .zero{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.bar small{color:var(--muted);display:block;font-size:11px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:600;color:var(--muted);text-align:start;padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.num{display:table-cell;direction:ltr;text-align:right}
.tbl small.cnt{display:block;color:var(--muted);font-size:11px;font-weight:400;direction:rtl;text-align:start;white-space:nowrap}
.tblwrap{overflow-x:auto}
.score b{font-size:17px;color:var(--ink)}

/* شريط الدرجة: كل شرط قطعة بعرض وزنه */
.strip{flex:1;display:flex;gap:2px;height:8px;direction:rtl;min-width:30px}
.strip i{display:block;height:100%;border-radius:2px;background:var(--line)}
.strip i.f{background:var(--c)}
.strip i.h{background:repeating-linear-gradient(-45deg,var(--c) 0 3px,color-mix(in srgb,var(--c) 30%,transparent) 3px 6px)}
.strip i.gap{flex:0 0 5px!important;background:transparent}
.r3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px 10px;font-size:13px;background:var(--sunk);border-radius:var(--radius-sm);padding:8px 10px}
.r3 div{min-width:0}
.r3 span{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.r3 b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r3 b.num{display:block;text-align:right}
.r3 div:first-child b{white-space:normal;line-height:1.35}
.gatenote{font-size:12px;color:var(--watch);margin-top:6px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius-lg);padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.more{display:block;margin:12px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 22px;font-weight:600}
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}

/* صفحة السهم */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;transform:translateY(100%);transition:transform .28s ease;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet .wrap{padding-top:10px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.shead .t{flex:1;min-width:0}
.shead .t b{font-size:22px;direction:ltr;display:inline-block}
.shead .t div{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.panel h2{font-size:16px;margin:0 0 2px;font-weight:700}
.panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero .big{font-size:44px;line-height:1;font-weight:700}
.hero .big small{font-size:16px;color:var(--muted);font-weight:500}
.hero .px b{font-size:24px}
.strip.big{height:16px;margin:14px 0 6px;gap:3px}
.strip.big i{border-radius:3px}
.legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.chartbox{direction:ltr;position:relative}
canvas{width:100%;height:280px;display:block;touch-action:pan-y}
.chartinfo{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);direction:rtl;margin-bottom:8px;min-height:19px}
.chartinfo b{color:var(--ink);font-weight:600}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.keys i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:var(--sunk);border-radius:var(--radius-sm);padding:9px 11px}
.kv span{display:block;color:var(--muted);font-size:12px}
.kv b.num{display:block;text-align:right}
.kv b{font-size:15px;font-weight:600}
.kv small{display:block;color:var(--muted);font-size:11.5px}
.kv small.n{direction:ltr;text-align:right}
.kv b span,.r3 b span,.kv small span{display:inline-block;color:inherit;font-size:inherit}
.conds{list-style:none;margin:0;padding:0}
.conds li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:11px 0}
.conds li+li{border-top:1px solid var(--line)}
.mark{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700}
.mark.f{background:color-mix(in srgb,var(--ready) 16%,transparent);color:var(--ready)}
.mark.h{background:color-mix(in srgb,var(--watch) 18%,transparent);color:var(--watch)}
.mark.z{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
.conds b{font-weight:600}
.conds p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pts{font-size:13px;color:var(--muted);white-space:nowrap;padding-top:3px}
.pts b{color:var(--ink)}
.warn{border-color:color-mix(in srgb,var(--watch) 45%,var(--line));background:color-mix(in srgb,var(--watch) 8%,var(--surface))}
.actions{display:flex;gap:8px}
.btn{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:11px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.disclaimer{font-size:12px;color:var(--muted);text-align:center;margin:14px 8px 0}
@media (max-width:360px){.hero .big{font-size:38px}}
</style>
</head>
<body>
<main class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <h1>فاحص <b>YGH</b></h1>
      <p>أسهم السوق الأمريكي بمنهج YGH</p>
    </div>
    <div class="top-actions">
    <button class="icon-btn" id="jBtn" aria-label="سجل الإشارات" title="سجل الإشارات (الاختبار الأمامي)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 10h6M9 14h6M9 18h4"/></svg>
    </button>
    <button class="icon-btn" id="btBtn" aria-label="الاختبار التاريخي" title="الاختبار التاريخي">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
    </button>
    <button class="icon-btn" id="reload" aria-label="تحديث النتائج">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    </div>
  </header>

  <section class="scanbar" aria-live="polite">
    <div><span class="dot" id="dot"></span><span>آخر مسح</span><strong id="lastScan">—</strong></div>
    <div><span>المسح القادم</span><strong id="nextScan" style="grid-column:1/-1">—</strong></div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tf="4h" aria-selected="true">4 ساعات<small>الأدق</small></button>
    <button role="tab" data-tf="1d" aria-selected="false">يومي</button>
  </nav>

  <section class="counters">
    <button class="counter" data-k="ready" aria-pressed="false"><b id="c-ready">0</b><span>جاهز</span></button>
    <button class="counter" data-k="near" aria-pressed="false"><b id="c-near">0</b><span>قريب من الجاهزية</span></button>
    <button class="counter" data-k="watch" aria-pressed="false"><b id="c-watch">0</b><span>مراقبة مبكرة</span></button>
  </section>

  <div class="tools">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ابحث برمز السهم أو اسمه" autocomplete="off" autocapitalize="characters">
    </label>
    <select id="sort" aria-label="الترتيب">
      <option value="score">الدرجة</option>
      <option value="dist">الأقرب للدعم</option>
      <option value="borrow">رسوم الاقتراض</option>
      <option value="float">الفلوت الأقل</option>
      <option value="chg">التغير اليومي</option>
      <option value="rr">العائد/المخاطرة</option>
      <option value="gap">الفجوة</option>
    </select>
  </div>
  <div class="chips">
    <button class="chip" id="favOnly" aria-pressed="false">★ المفضلة</button>
    <button class="chip" id="showAll" aria-pressed="false">عرض غير المؤهل</button>
  </div>

  <div class="resultline"><b id="count">—</b><span id="tfnote"></span></div>
  <p class="pricenote" id="pricenote"></p>
  <ul class="list" id="list"></ul>
  <div id="emptyBox"></div>
  <button class="more" id="more" hidden>عرض المزيد</button>
  <p class="foot">أداة تعليمية لتطبيق منهج YGH، وليست توصية شراء أو بيع. حدّد وقفك قبل أي دخول.</p>
</main>

<section class="sheet" id="sheet" aria-modal="true" role="dialog" aria-label="تفاصيل السهم">
  <div class="wrap" id="sheetBody"></div>
</section>

<script>
const SCHEDULE_UTC = [[12, 45], [17, 40], [18, 40], [21, 15]];   // نفس مواعيد scan.yml
const PAGE = 40;
const COUNTRIES = {
  "China":["🇨🇳","الصين",true], "Hong Kong":["🇭🇰","هونغ كونغ",true], "Taiwan":["🇹🇼","تايوان"],
  "United States":["🇺🇸","أمريكا"], "Canada":["🇨🇦","كندا"], "Malaysia":["🇲🇾","ماليزيا"],
  "Singapore":["🇸🇬","سنغافورة"], "Israel":["🇮🇱","إسرائيل"], "United Kingdom":["🇬🇧","بريطانيا"],
  "Japan":["🇯🇵","اليابان"], "Cayman Islands":["🇰🇾","جزر كايمان"], "British Virgin Islands":["🇻🇬","جزر العذراء"],
  "Bermuda":["🇧🇲","برمودا"], "Greece":["🇬🇷","اليونان"], "Netherlands":["🇳🇱","هولندا"],
  "Germany":["🇩🇪","ألمانيا"], "Switzerland":["🇨🇭","سويسرا"], "Australia":["🇦🇺","أستراليا"],
  "Brazil":["🇧🇷","البرازيل"], "India":["🇮🇳","الهند"], "Ireland":["🇮🇪","أيرلندا"],
  "Thailand":["🇹🇭","تايلاند"], "Vietnam":["🇻🇳","فيتنام"], "Indonesia":["🇮🇩","إندونيسيا"],

const fmtP = x => x==null ? "—" : (x>=1 ? x.toFixed(2) : x.toFixed(4));
function human(n){
  if(n==null) return "—";
  for(const [d,s] of [[1e9,"B"],[1e6,"M"],[1e3,"K"]]) if(n>=d) return (n/d).toFixed(2).replace(/\.?0+$/,"")+s;
  return String(Math.round(n));
}
const fmtPct = x => (x>0?"+":"")+x.toFixed(2)+"%";
const timeFmt = new Intl.DateTimeFormat("ar",{hour:"numeric",minute:"2-digit",numberingSystem:"latn",calendar:"gregory"});
const dayFmt = new Intl.DateTimeFormat("ar",{weekday:"long",numberingSystem:"latn",calendar:"gregory"});
function whenText(d){
  const now = new Date();
  const same = d.toDateString()===now.toDateString();
  const tmr = new Date(now); tmr.setDate(now.getDate()+1);
  const prefix = same ? "" : (d.toDateString()===tmr.toDateString() ? "غداً " : dayFmt.format(d)+" ");
  return prefix + timeFmt.format(d);
}
function nextScan(){
  const now = new Date();
  for(let add=0; add<8; add++){
    const day = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()+add));
    const wd = day.getUTCDay();
    if(wd===0||wd===6) continue;
    for(const [h,m] of SCHEDULE_UTC){
      const t = new Date(day); t.setUTCHours(h,m,0,0);
      if(t>now) return t;
    }
  }
  return null;
}
function parseUTC(s){ if(!s) return null; const [d,t]=s.split(" "); return new Date(d+"T"+t+":00Z"); }
function flagOf(c){ return COUNTRIES[c] || null; }
// ويندوز لا يرسم أعلام الدول (يظهرها حروفاً مثل US)، فنعرض اسم الدولة بدلاً منها لغير الأمريكية
const NO_FLAGS = /Windows/i.test(navigator.userAgent);
function flagHTML(f){
  if(!f) return "";
  if(!NO_FLAGS) return `<span class="flag" title="${f[1]}">${f[0]}</span>`;
  return (f[1]==="أمريكا" || f[2]) ? "" : `<span class="cc">${f[1]}</span>`;  // الصين وهونغ كونغ لها شارة خاصة
}
function distToZone(r){
  if(!r.support_zone) return null;
  const [lo,hi] = r.support_zone, p = r.price;
  if(p>hi) return (p-hi)/hi; if(p<lo) return (p-lo)/lo; return 0;
}

function rvolLabel(x){

}
function extWarn(r){

}

function rrClass(x){ return x==null ? "" : x>=MIN_RR ? "good" : x>=1.5 ? "mid" : "bad"; }

/* ---------- شريط الدرجة ---------- */
function stripHTML(r, big){
  const c = `var(${STATUS_COLOR[r.status]})`;
  let out = `<div class="strip${big?" big":""}" style="--c:${c}" aria-hidden="true">`;
  r.conditions.forEach((k,i)=>{
    if(i===TECH_KEYS.length) out += `<i class="gap"></i>`;
    const cls = k.result===1 ? "f" : k.result===0.5 ? "h" : "";
    out += `<i class="${cls}" style="flex:${k.weight}"></i>`;
  });
  return out + `</div>`;
}

function rows(){
  if(!state.data) return [];
  let rs = state.data.timeframes[state.tf] || [];
  if(!state.showAll) rs = rs.filter(r=>r.status!=="none");
  if(state.status) rs = rs.filter(r=>r.status===state.status);
  if(state.favOnly) rs = rs.filter(r=>state.favs.has(r.symbol));
  const q = state.q.trim().toUpperCase();
  if(q) rs = rs.filter(r=>r.symbol.includes(q) || (r.name||"").toUpperCase().includes(q));
  const by = {
    score:(a,b)=>b.score-a.score,
    borrow:(a,b)=>(b.borrow_fee||0)-(a.borrow_fee||0),
    float:(a,b)=>(a.float??Infinity)-(b.float??Infinity),
    chg:(a,b)=>b.change_pct-a.change_pct,
    dist:(a,b)=>Math.abs(distToZone(a)??9)-Math.abs(distToZone(b)??9),
    gap:(a,b)=>(b.ext?b.ext.gap_pct:-1e9)-(a.ext?a.ext.gap_pct:-1e9),
    rr:(a,b)=>((b.risk&&b.risk.rr)??-1)-((a.risk&&a.risk.rr)??-1),
  }[state.sort];
  return [...rs].sort(by);
}

/* ---------- الشارت ---------- */
function drawChart(cv, r, hoverIdx){
  const bars = r.chart || [];
  const css = getComputedStyle(document.documentElement);
  const col = n => css.getPropertyValue(n).trim();
  const dpr = window.devicePixelRatio||1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  if(!bars.length){ g.fillStyle=col("--muted"); g.font="14px sans-serif"; g.textAlign="center"; g.fillText("No chart data",W/2,H/2); return; }
  const axisW = 50, padT = 10, padB = 18, plotW = W-axisW;
  let lo = Math.min(...bars.map(b=>b.l)), hi = Math.max(...bars.map(b=>b.h));
  const z = r.support_zone, res = r.resistance, maj = r.major_support;
  if(z){ lo = Math.min(lo, z[0]); hi = Math.max(hi, z[1]); }
  if(res && res < hi*1.25) hi = Math.max(hi, res);
  if(r.ext){ lo = Math.min(lo, r.ext.price); hi = Math.max(hi, r.ext.price); }
  const K = r.risk;
  if(K){ lo = Math.min(lo, K.stop); if(K.t1 && K.t1 < hi*1.3) hi = Math.max(hi, K.t1); }
  if(maj && maj.zone_low > lo*0.8) lo = Math.min(lo, maj.zone_low);
  const pad = (hi-lo)*0.06; lo-=pad; hi+=pad;
  const y = v => padT + (hi-v)/(hi-lo)*(H-padT-padB);
  const step = plotW/bars.length, bw = Math.max(1.5, step*0.62);
  const x = i => i*step + step/2;

  // شبكة ومحور السعر
  g.font = "11px 'IBM Plex Sans Arabic',Tahoma,sans-serif"; g.textAlign="left"; g.textBaseline="middle";
  for(let k=0;k<=4;k++){
    const v = lo + (hi-lo)*k/4, yy = y(v);
    g.strokeStyle = col("--line"); g.lineWidth=1; g.beginPath(); g.moveTo(0,yy); g.lineTo(plotW,yy); g.stroke();
    g.fillStyle = col("--muted"); g.fillText(fmtP(v), plotW+6, yy);
  }
  // منطقة الدعم
  if(z){
    g.fillStyle = col("--zone"); g.fillRect(0, y(z[1]), plotW, Math.max(2, y(z[0])-y(z[1])));
    g.strokeStyle = col("--ready"); g.lineWidth=1.5; g.beginPath(); g.moveTo(0,y(r.support)); g.lineTo(plotW,y(r.support)); g.stroke();
  }
  if(maj && z && Math.abs(maj.level-r.support)/r.support > 0.005){
    g.setLineDash([6,4]); g.strokeStyle = col("--ready"); g.lineWidth=1;
    g.beginPath(); g.moveTo(0,y(maj.level)); g.lineTo(plotW,y(maj.level)); g.stroke(); g.setLineDash([]);
  }
  if(res && res<=hi){
    g.setLineDash([6,4]); g.strokeStyle = col("--down"); g.lineWidth=1.2;
    g.beginPath(); g.moveTo(0,y(res)); g.lineTo(plotW,y(res)); g.stroke(); g.setLineDash([]);
  }
  // الوقف
  if(K){
    g.strokeStyle = col("--down"); g.lineWidth=1.6;
    g.beginPath(); g.moveTo(0,y(K.stop)); g.lineTo(plotW,y(K.stop)); g.stroke();
    g.fillStyle = col("--down"); g.fillRect(plotW+1, y(K.stop)-9, axisW-1, 18);
    g.fillStyle = "#fff"; g.textAlign="left"; g.textBaseline="middle"; g.fillText(fmtP(K.stop), plotW+6, y(K.stop));
  }
  // الشموع
  bars.forEach((b,i)=>{
    const upc = b.c>=b.o, c = upc ? col("--up") : col("--down");
    g.strokeStyle=c; g.fillStyle=c; g.lineWidth=1;
    g.beginPath(); g.moveTo(x(i),y(b.h)); g.lineTo(x(i),y(b.l)); g.stroke();
    const top = y(Math.max(b.o,b.c)), h = Math.max(1, Math.abs(y(b.o)-y(b.c)));
    g.fillRect(x(i)-bw/2, top, bw, h);
  });
  // المتوسطات
  for(const [k,cn] of [["ma20","--ma20"],["ma50","--ma50"]]){
    g.strokeStyle = col(cn); g.lineWidth=1.6; g.beginPath(); let started=false;
    bars.forEach((b,i)=>{ if(b[k]==null) return; started ? g.lineTo(x(i),y(b[k])) : g.moveTo(x(i),y(b[k])); started=true; });
    g.stroke();
  }
  // السعر الحالي
  const last = bars[bars.length-1];
  g.fillStyle = col("--accent"); const ly = y(last.c);
  g.fillRect(plotW+1, ly-9, axisW-1, 18);
  g.fillStyle = col("--accent-ink"); g.fillText(fmtP(last.c), plotW+6, ly);
  // سعر ما قبل الافتتاح / ما بعد الإغلاق
  if(r.ext){
    const ey = y(r.ext.price);
    g.setLineDash([2,3]); g.strokeStyle = col("--watch"); g.lineWidth=1.4;
    g.beginPath(); g.moveTo(0,ey); g.lineTo(plotW,ey); g.stroke(); g.setLineDash([]);
    g.fillStyle = col("--watch"); g.fillRect(plotW+1, ey-9, axisW-1, 18);
    g.fillStyle = "#fff"; g.fillText(fmtP(r.ext.price), plotW+6, ey);
  }
  // مؤشر اللمس
  if(hoverIdx!=null){
    g.strokeStyle = col("--muted"); g.setLineDash([3,3]); g.beginPath(); g.moveTo(x(hoverIdx),padT); g.lineTo(x(hoverIdx),H-padB); g.stroke(); g.setLineDash([]);
  }
  // تاريخ أول وآخر شمعة
  g.fillStyle = col("--muted"); g.textBaseline="alphabetic";
  g.textAlign="left"; g.fillText(bars[0].t.replace(" 00:00",""), 2, H-4);
  g.textAlign="right"; g.fillText(last.t.replace(" 00:00",""), plotW-2, H-4);
}

    <span>أدنى <b class="num">${fmtP(b.l)}</b></span><span>إغلاق <b class="num">${fmtP(b.c)}</b></span><span>فوليوم <b class="num">${human(b.v)}</b></span>`;

      return `<div class="panel">
      <h2>مقارنة صيغ المنهج</h2>
      <p class="sub">نفس الأسهم بقواعد مختلفة. R متوسط ربح الصفقة بمضاعفات المخاطرة، وتحته المتوسط بعد استبعاد أفضل 5% من الصفقات: إن بقي موجباً فالربح لا يعتمد على صفقات محظوظة. الصيغة التي صفقاتها أقل من 20 لا يُعتمد عليها.</p>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>الصيغة</th><th>صفقات</th><th>رابحة</th><th>متوسط</th></tr></thead><tbody>
      ${b.variants.map(x=>`<tr${best&&x.key===best.key?` style="background:color-mix(in srgb,var(--ready) 10%,transparent)"`:""}>
        <td style="white-space:normal">${x.name}</td><td>${x.trades}</td>
        <td class="num">${x.win_rate==null?"—":x.win_rate+"%"}<small class="cnt">الوقف ${x.stop_rate==null?"—":x.stop_rate+"%"}${x.gap_rate?` • فجوات ${x.gap_rate}%`:""}</small></td>
        <td class="num ${x.avg_r>0?"up":x.avg_r<0?"down":""}"><b>${x.avg_r==null?"—":(x.avg_r>0?"+":"")+x.avg_r+"R"}</b><small class="cnt">${x.avg_r_trim!=null?`بلا أفضل 5%: ${(x.avg_r_trim>0?"+":"")+x.avg_r_trim}R`:`مجموع ${x.total_r==null?"—":(x.total_r>0?"+":"")+x.total_r+"R"}`}</small></td></tr>`).join("")}
      </tbody></table></div>
      ${best?`<p class="sub" style="margin:10px 0 0;color:var(--ink)">${key(best)>0
        ? `أفضل صيغة بعينة كافية (بعد استبعاد أفضل 5%): <b>${best.name}</b> بمتوسط <span class="num">+${key(best)}R</span> على ${best.trades} صفقة.`
        : `كل الصيغ سالبة بعد استبعاد أفضل 5% من صفقاتها، أي أن ربحها يعتمد على صفقات قليلة كبيرة. الأقل خسارة: <b>${best.name}</b> (<span class="num">${key(best)}R</span>).`}</p>`:""}
    </div>`; })() : ""}

    ${b.halves && b.halves.length===2 ? `<div class="panel">
      <h2>هل تتكرر النتيجة في نصفي الفترة؟</h2>
      <p class="sub">الفترة مقسومة نصفين. الصيغة الجيدة فعلاً تربح في النصفين، أما التي تربح في نصف وتخسر في الآخر فنتيجتها صدفة غالباً.</p>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>الصيغة</th>${b.halves.map(h=>`<th>${h.label}<small class="cnt num" style="direction:ltr">${(h.from||"").slice(0,7)} → ${(h.to||"").slice(0,7)}</small></th>`).join("")}</tr></thead><tbody>
      ${b.halves[0].variants.map((x,i)=>`<tr><td style="white-space:normal;min-width:130px">${x.name}</td>${b.halves.map(h=>{const y=h.variants[i]; return `<td class="num ${y.avg_r>0?"up":y.avg_r<0?"down":""}"><b>${y.avg_r==null?"—":(y.avg_r>0?"+":"")+y.avg_r+"R"}</b><small class="cnt">${y.trades} صفقة</small></td>`;}).join("")}</tr>`).join("")}
      </tbody></table></div>
    </div>` : ""}

    ${b.floats ? `<div class="panel">
      <h2>النتائج حسب حجم الفلوت</h2>
      <p class="sub">التذبذب = مدى تفاوت العائد بعد 10 أيام (كلما ارتفع زادت المخاطرة). والفجوات = نسبة الصفقات التي افتتح فيها السهم تحت الوقف، فكانت الخسارة أكبر من المخطط.</p>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>الفلوت</th><th>عائد 10 أيام</th><th>التذبذب</th><th>الصفقات</th></tr></thead><tbody>
      ${b.floats.filter(f=>f.days.n).map(f=>`<tr><td>${f.label}<small class="cnt">${f.days.n.toLocaleString("en")} شمعة</small></td>
        <td class="num ${f.days.mean>0?"up":"down"}">${v(f.days.mean)}</td>
        <td class="num">${f.volatility??"—"}</td>
        <td class="num ${f.t_avg_r>0?"up":f.t_avg_r<0?"down":""}"><b>${f.t_avg_r==null?"—":(f.t_avg_r>0?"+":"")+f.t_avg_r+"R"}</b><small class="cnt">${f.t_trades} صفقة${f.t_gap_rate?` • فجوات ${f.t_gap_rate}%`:""}${f.t_worst_r!=null?` • أسوأ ${f.t_worst_r}R`:""}</small></td></tr>`).join("")}
      </tbody></table></div>
    </div>` : ""}

    ${b.audit && b.audit.best && b.audit.best.length ? `<div class="panel">
      <h2>أفضل الصفقات: هل هي حقيقية؟</h2>
      <p class="sub">معظم ربح المنهج يأتي من هذه الصفقات. المعلّمة ⚡ فيها قفزة شمعة أكبر من 100% أو تقع قرب تقسيم عكسي؛ تحققنا من عينة منها بمصدر بيانات مستقل (Twelve Data) وكانت قفزات حقيقية بفوليوم ضخم. الرموز روابط لشارت كل سهم على TradingView.</p>
      ${sim.cost_pct!=null ? `<p class="sub" style="color:var(--ink)">R محسوبة من المخاطرة المخططة يوم الإشارة، بعد خصم تكلفة <span class="num">${sim.cost_pct}%</span> لكل صفقة، وبوقف لا يقل عن <span class="num">${sim.min_risk_pct}%</span> من السعر.</p>` : ""}
      <div class="tblwrap"><table class="tbl"><thead><tr><th>السهم</th><th>الإشارة</th><th>الحركة</th><th>R</th></tr></thead><tbody>
      ${b.audit.best.map(a=>`<tr${a.suspect?` style="background:color-mix(in srgb,var(--watch) 12%,transparent)"`:""}>
        <td><a class="num" style="color:var(--accent);font-weight:700" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(a.s)}" target="_blank" rel="noopener">${a.s}</a>${a.suspect?`<small class="cnt">⚡ ${a.near_split?"قرب تقسيم":"قفزة "+a.max_jump_pct+"%"}</small>`:""}</td>
        <td class="num">${a.d.slice(0,10)}<small class="cnt">خروج ${(a.exit_d||"—").slice(0,10)}</small></td>
        <td class="num ${a.move_pct>0?"up":"down"}"><b>${a.move_pct!=null?(a.move_pct>0?"+":"")+a.move_pct+"%":"—"}</b><small class="cnt">من ${a.entry!=null?fmtP(a.entry):"—"} إلى ${a.exit_px!=null?fmtP(a.exit_px):"—"}</small></td>
        <td class="num ${a.r>0?"up":"down"}"><b>${(a.r>0?"+":"")+a.r}</b></td></tr>`).join("")}
      </tbody></table></div>
    </div>` : ""}

    <div class="panel">
      <h2>آخر الإشارات ونتيجتها</h2>
      <p class="sub">الدخول بافتتاح اليوم التالي، والخروج عند الهدف أو الوقف أو بعد ${m.max_hold} يوم تداول.</p>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>السهم</th><th>التاريخ</th><th>الدرجة</th><th>ع/م</th><th>النتيجة</th><th>الخروج</th></tr></thead><tbody>${recent||`<tr><td colspan="6">لا توجد إشارات.</td></tr>`}</tbody></table></div>
    </div>

    <div class="panel warn">
      <h2>حدود هذا الاختبار</h2>
      <p class="sub" style="margin:0">الفلوت ورسوم الاقتراض محسوبة بقيمتها الحالية لأن تاريخها غير متوفر مجاناً. والأسهم المختبرة هي المرشحة اليوم من IBKR، فالأسهم التي شُطبت في الفترة غير موجودة، وهذا يجعل النتائج أفضل قليلاً من الحقيقة. وفريم 4 ساعات مبني من شموع الساعة المجانية لآخر سنتين تقريباً. وتشمل النتائج خصماً تقديرياً للتكلفة (عمولة وفرق سعر) لكل صفقة، لكن الانزلاق الفعلي في الأسهم الصغيرة قد يكون أكبر.</p>
    </div>
    <p class="disclaimer">آخر تشغيل ${m.generated_at_utc} UTC. النتائج السابقة لا تضمن نتائج مستقبلية.</p>`;
  $("#close").onclick = () => history.back();

  body.querySelectorAll("[data-bt]").forEach(x=>x.onclick=()=>{ cur = state.btTf = x.dataset.bt; draw(); });
  };
  draw();
}

/* ---------- سجل الإشارات ---------- */
const STATE_AR = {pending:"بانتظار الدخول", open:"مفتوحة", target:"الهدف", stop:"الوقف", gap:"فجوة", time:"انتهت المدة", no_entry:"لم تُفتح", closed:"مغلقة"};
async function openJournal(push=true){
  const body = $("#sheetBody");
  const head = `<div class="shead"><button class="icon-btn" id="close" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button><div class="t"><b style="direction:rtl">سجل الإشارات</b><div>الاختبار الأمامي على بيانات جديدة</div></div></div>`;
  body.innerHTML = head + `<div class="panel"><p class="sub" style="margin:0">جارٍ التحميل…</p></div>`;
  const sheet = $("#sheet"); sheet.classList.add("open"); sheet.scrollTop = 0; document.body.style.overflow = "hidden";
  if(push) history.pushState({j:1}, "", "#journal");
  $("#close").onclick = () => history.back();
  let j;
  try{ const res = await fetch("journal.json?t="+Date.now(), {cache:"no-store"}); if(!res.ok) throw 0; j = await res.json(); }
  catch{ body.querySelector(".panel").innerHTML = `<h2>السجل لم يبدأ بعد</h2><p class="sub" style="margin:0">يبدأ تلقائياً مع أول مسح بعد التحديث، ويسجل كل سهم جاهز أو قريب من الجاهزية.</p>`; return; }

  const S = j.summary || {}, A = S.all || {}, D = S.daily75 || {};
  const R = x => x==null ? "—" : (x>0?"+":"") + x + "R";
  const P = x => x==null ? "—" : (x>0?"+":"") + x + "%";
  const cls = x => x==null ? "" : x>0 ? "up" : x<0 ? "down" : "";
  const NEED = 30;
  const verdict = (A.closed||0) < NEED
    ? `العينة ما زالت صغيرة: <b class="num">${A.closed||0}</b> صفقة مغلقة من <b class="num">${NEED}</b> على الأقل. لا تحكم على المنهج قبلها، فبضع صفقات قد تكون حظاً أو سوء حظ.`
    : A.avg_r > 0.1 && (A.avg_r_trim??A.avg_r) > 0 ? "المنهج رابح على بيانات جديدة، وحتى بعد استبعاد أفضل 5% من الصفقات. هذه أقوى نتيجة ممكنة، لكن استمر بحجم صفقات صغير."
    : A.avg_r > 0 ? "المنهج رابح قليلاً على البيانات الجديدة، لكن الربح يعتمد على صفقات قليلة. استمر بالمراقبة قبل زيادة أي حجم."
    : "المنهج خاسر على البيانات الجديدة، كما توقع الاختبار التاريخي. لا تعتمد عليه للدخول.";
  const tfLine = k => { const x = S[k]||{}; return `${k==="4h"?"4 ساعات":"يومي"}: <span class="num">${x.closed||0}</span> مغلقة، متوسط <span class="num ${cls(x.avg_r)}">${R(x.avg_r)}</span>`; };
  const sym = e => `<a class="num" style="color:var(--accent);font-weight:700" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(e.s)}" target="_blank" rel="noopener">${e.s}</a>`;
  const live = j.signals.filter(e=>e.state==="open"||e.state==="pending").sort((a,b)=>b.bar_t.localeCompare(a.bar_t));
  const done = j.signals.filter(e=>!["open","pending"].includes(e.state)).sort((a,b)=>(b.exit_t||b.bar_t).localeCompare(a.exit_t||a.bar_t));
  const d75open = j.daily75.filter(e=>e.state!=="closed"), d75done = j.daily75.filter(e=>e.state==="closed").slice(-20).reverse();

  body.innerHTML = head + `
    <div class="panel">
      <h2>الخلاصة</h2>
      <p class="sub">منذ ${j.started_utc||"—"} UTC • آخر تحديث ${j.updated_utc||"—"} UTC</p>
      <div class="bt-cards">
        <div class="kv"><span>صفقات مغلقة</span><b class="num">${A.closed||0}</b><small>مفتوحة <span class="num">${A.open||0}</span>، بانتظار الدخول <span class="num">${A.pending||0}</span></small></div>
        <div class="kv"><span>متوسط الصفقة</span><b class="num ${cls(A.avg_r)}">${R(A.avg_r)}</b><small>بلا أفضل 5%: <span class="num">${R(A.avg_r_trim)}</span></small></div>
        <div class="kv"><span>الرابحة</span><b class="num">${A.win_rate==null?"—":A.win_rate+"%"}</b><small>الهدف <span class="num">${A.targets||0}</span>، والوقف <span class="num">${A.stops||0}</span></small></div>
        <div class="kv"><span>المجموع</span><b class="num ${cls(A.total_r)}">${R(A.total_r)}</b><small>${tfLine("4h")}<br>${tfLine("1d")}</small></div>
      </div>
      <p class="sub" style="margin:12px 0 0;color:var(--ink)">${verdict}</p>
    </div>

    ${S.alt_close ? `<div class="panel">
      <h2>تجربة موازية: الوقف على الإغلاق</h2>
      <p class="sub">نفس الإشارات، لكن الصفقة لا تُغلق إلا إذا <b>أغلقت</b> شمعة تحت الوقف، لا بمجرد لمسه. للمقارنة فقط، ولا تغير نتيجة المنهج.</p>
      <div class="bt-cards">
        <div class="kv"><span>متوسط الصفقة</span><b class="num ${cls(S.alt_close.avg_r)}">${R(S.alt_close.avg_r)}</b><small>مقابل <span class="num">${R(A.avg_r)}</span> بالوقف الحالي</small></div>
        <div class="kv"><span>المجموع</span><b class="num ${cls(S.alt_close.total_r)}">${R(S.alt_close.total_r)}</b><small>مغلقة <span class="num">${S.alt_close.closed}</span>، مفتوحة <span class="num">${S.alt_close.open}</span></small></div>
      </div>
    </div>` : ""}

    <div class="panel">
      <h2>الصفقات المفتوحة</h2>
      <p class="sub">الدخول بافتتاح الشمعة التالية للإشارة، والخروج عند الهدف أو الوقف أو بعد ${20} يوم تداول. R الحالية محسوبة من آخر إغلاق.</p>
      ${live.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>السهم</th><th>الإشارة</th><th>الخطة</th><th>الآن</th></tr></thead><tbody>
      ${live.map(e=>`<tr><td>${sym(e)}<small class="cnt">${e.tf==="4h"?"4 ساعات":"يومي"}</small><small class="cnt">${e.status==="ready"?"جاهز":"قريب"}</small></td>
        <td class="num">${e.bar_t.slice(0,10)}<small class="cnt">${STATE_AR[e.state]}</small></td>
        <td class="num">${e.entry!=null?fmtP(e.entry):fmtP(e.ref)}<small class="cnt">وقف ${fmtP(e.stop)}</small><small class="cnt">هدف ${fmtP(e.t1)}</small></td>
        <td class="num ${cls(e.r_now)}"><b>${R(e.r_now)}</b><small class="cnt">${e.last_px!=null?fmtP(e.last_px):""}</small></td></tr>`).join("")}
      </tbody></table></div>` : `<p class="sub" style="margin:0">لا توجد صفقات مفتوحة الآن.</p>`}
    </div>

    <div class="panel">
      <h2>الصفقات المغلقة</h2>
      ${done.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>السهم</th><th>الإشارة</th><th>الخروج</th><th>النتيجة</th></tr></thead><tbody>
      ${done.slice(0,40).map(e=>`<tr><td>${sym(e)}<small class="cnt">${e.tf==="4h"?"4 ساعات":"يومي"}</small></td>
        <td class="num">${e.bar_t.slice(0,10)}<small class="cnt">دخول ${e.entry!=null?fmtP(e.entry):"—"}</small></td>
        <td>${STATE_AR[e.state]}<small class="cnt num">${(e.exit_t||"").slice(0,10)}</small></td>
        <td class="num ${cls(e.r)}"><b>${R(e.r)}</b>${e.alt_close&&e.alt_close.state&&e.alt_close.state!=="no_entry"?`<small class="cnt">على الإغلاق:</small><small class="cnt num">${e.alt_close.state==="open"?"مفتوحة "+R(e.alt_close.r_now):R(e.alt_close.r)}</small>`:""}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="sub" style="margin:0">لم تُغلق أي صفقة بعد.</p>`}
    </div>

    <div class="panel">
      <h2>خيط اليومي 75+</h2>
      <p class="sub">كل سهم درجته الفنية على اليومي 75% فأكثر، وعائده بعد 10 أيام تداول بلا هدف ولا وقف، بعد خصم التكلفة. في الاختبار التاريخي حققت هذه الفئة متوسط +3.6% مقابل ‎-0.9% لكل الأسهم، والسجل يختبر هل يتكرر ذلك.</p>
      <div class="bt-cards">
        <div class="kv"><span>مكتملة</span><b class="num">${D.closed||0}</b><small>جارية <span class="num">${D.open||0}</span></small></div>
        <div class="kv"><span>متوسط العائد</span><b class="num ${cls(D.avg_ret)}">${P(D.avg_ret)}</b><small>الوسيط <span class="num">${P(D.median_ret)}</span>، الصاعدة <span class="num">${D.win_rate==null?"—":D.win_rate+"%"}</span></small></div>
      </div>
      ${d75done.length?`<div class="tblwrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>السهم</th><th>الإشارة</th><th>العائد</th></tr></thead><tbody>
      ${d75done.map(e=>`<tr><td>${sym(e)}</td><td class="num">${e.bar_t.slice(0,10)}</td><td class="num ${cls(e.ret)}"><b>${P(e.ret)}</b></td></tr>`).join("")}</tbody></table></div>`:""}
      ${d75open.length?`<p class="sub" style="margin:10px 0 0">جارية الآن: ${d75open.map(e=>`${sym(e)} <small class="num ${cls(e.ret_now)}">${e.ret_now!=null?P(e.ret_now):"بانتظار الدخول"}</small>`).join(" • ")}</p>`:""}
    </div>
    <p class="disclaimer">السجل يتحدث تلقائياً مع كل مسح. النتائج السابقة لا تضمن نتائج مستقبلية.</p>`;
  $("#close").onclick = () => history.back();
}

/* ---------- التحميل ---------- */
async function load(){
  const btn = $("#reload"); btn.disabled = true; btn.style.opacity=.5;
  try{
    const res = await fetch("results.json?t="+Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    state.data = await res.json();
    const last = parseUTC(state.data.meta.generated_at_utc);
    $("#lastScan").textContent = last ? whenText(last) : "—";
    const hrs = last ? (Date.now()-last)/36e5 : 99;
    $("#dot").classList.toggle("old", hrs > 26);
  }catch(e){
    state.data = null;
    $("#emptyBox").innerHTML = `<div class="empty"><b>لا توجد نتائج بعد</b>ملف النتائج غير موجود في هذا الموقع. شغّل المسح من تبويب Actions في مستودع المحرك، وستظهر النتائج هنا بعد اكتماله.</div>`;
  }
  const n = nextScan(); $("#nextScan").textContent = n ? whenText(n) : "—";
  btn.disabled = false; btn.style.opacity=1;
  render();
  const s = location.hash.slice(1);
  if(s==="backtest") openBacktest(false); else if(s==="journal") openJournal(false); else if(s && state.data) openSheet(s, false);
}

/* ---------- الأحداث ---------- */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  state.tf = b.dataset.tf; state.shown = PAGE;
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
  render();
});
document.querySelectorAll(".counter").forEach(b=>b.onclick=()=>{
  state.status = state.status===b.dataset.k ? null : b.dataset.k; state.shown = PAGE; render();
});
$("#q").addEventListener("input", e=>{ state.q = e.target.value; state.shown = PAGE; render(); });
$("#sort").onchange = e => { state.sort = e.target.value; render(); };
$("#favOnly").onclick = e => { state.favOnly = !state.favOnly; e.currentTarget.setAttribute("aria-pressed", state.favOnly); state.shown=PAGE; render(); };
$("#showAll").onclick = e => { state.showAll = !state.showAll; e.currentTarget.setAttribute("aria-pressed", state.showAll); state.shown=PAGE; render(); };
$("#more").onclick = () => { state.shown += PAGE; render(); };
$("#list").addEventListener("click", e=>{ const b = e.target.closest(".row"); if(b) openSheet(b.dataset.s); });
$("#reload").onclick = load;
$("#btBtn").onclick = () => openBacktest();
$("#jBtn").onclick = () => openJournal();
load();
</script>
</body>
</html>
